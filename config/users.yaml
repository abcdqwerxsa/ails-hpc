# AILS HPC 开发账号（仅 bcrypt 哈希入库）。
# 明文密码仅供本地开发便利，**生产环境务必通过 AILS_USERS_FILE 指向独立维护的文件覆盖**。
#
#   admin          / admin123        — 超级系统管理员（纯硬件监控 + DRAIN/RESUME）
#   tenantadmin    / tenantadmin123  — 租户管理员（member 能力 + 团队管理）
#   member         / member123       — 普通租户成员（作业/容器/登录节点）
#   ops            / ops123          — 运营人员（纯绩效大屏，零写操作）
#
# clusterUser/uid/gid/account：真·每用户 Slurm 隔离（L1+L3）。clusterUser 为集群 unix
# 身份，account 为 Slurm 账号（== clusterUser）。gid 2000=ailshpc 共享组。uid 避让
# 991(munge)/64030(slurm)/1001(hpcuser)。部署时 entrypoint 按本表在所有节点 useradd +
# sacctmgr 建 account/association（见 deploy/slurm-cluster/config/entrypoint.sh）。
