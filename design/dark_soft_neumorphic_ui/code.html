<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Living Room Control Detail Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-led": "#00ffcc",
                        "primary-led-dim": "rgba(0, 255, 204, 0.2)",
                        "secondary-led": "#ff3366",
                        "metal-base": "#2a2c30",
                        "metal-light": "#3b3d42",
                        "metal-dark": "#1a1b1e",
                        "on-metal": "#e0e0e0",
                        "on-metal-muted": "#8a8d93"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px"
                    },
                    "spacing": {
                            "unit": "8px",
                            "container-padding": "24px",
                            "gutter": "16px",
                            "margin-mobile": "16px",
                            "margin-desktop": "32px"
                    },
                    "fontFamily": {
                            "body-md": [
                                    "Inter"
                            ],
                            "headline-lg-mobile": [
                                    "Montserrat"
                            ],
                            "label-caps": [
                                    "Inter"
                            ],
                            "body-lg": [
                                    "Inter"
                            ],
                            "headline-lg": [
                                    "Montserrat"
                            ],
                            "headline-md": [
                                    "Montserrat"
                            ]
                    },
                    "fontSize": {
                            "body-md": [
                                    "16px",
                                    {
                                            "lineHeight": "1.5",
                                            "letterSpacing": "0.01em",
                                            "fontWeight": "400"
                                    }
                            ],
                            "headline-lg-mobile": [
                                    "24px",
                                    {
                                            "lineHeight": "1.2",
                                            "letterSpacing": "0.02em",
                                            "fontWeight": "700"
                                    }
                            ],
                            "label-caps": [
                                    "12px",
                                    {
                                            "lineHeight": "1.2",
                                            "letterSpacing": "0.08em",
                                            "fontWeight": "600"
                                    }
                            ],
                            "body-lg": [
                                    "18px",
                                    {
                                            "lineHeight": "1.6",
                                            "letterSpacing": "0.01em",
                                            "fontWeight": "400"
                                    }
                            ],
                            "headline-lg": [
                                    "32px",
                                    {
                                            "lineHeight": "1.2",
                                            "letterSpacing": "0.02em",
                                            "fontWeight": "700"
                                    }
                            ],
                            "headline-md": [
                                    "20px",
                                    {
                                            "lineHeight": "1.3",
                                            "letterSpacing": "0.01em",
                                            "fontWeight": "600"
                                    }
                            ]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #1a1b1e;
            background-image: 
                radial-gradient(circle at 50% 0%, #2a2c30 0%, transparent 70%),
                linear-gradient(to bottom, #1a1b1e, #141517);
        }

        .metal-panel {
            background: linear-gradient(135deg, #32353a 0%, #222428 100%);
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.6),
                -4px -4px 12px rgba(255, 255, 255, 0.05),
                inset 1px 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid #141517;
            position: relative;
            overflow: hidden;
        }

        .metal-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 2px,
                    rgba(255,255,255,0.01) 2px,
                    rgba(255,255,255,0.01) 4px
                );
            pointer-events: none;
        }

        .metal-cut-edge {
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 1px 0 0 rgba(255,255,255,0.05),
                inset -1px -1px 0 rgba(0,0,0,0.5);
        }

        .brushed-metal-btn {
            background: linear-gradient(to bottom, #3b3d42 0%, #2a2c30 100%);
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.5),
                inset 0 2px 1px rgba(255,255,255,0.2),
                inset 0 -1px 2px rgba(0,0,0,0.5);
            border: 1px solid #111;
            position: relative;
        }

        .brushed-metal-btn::after {
            content: '';
            position: absolute;
            top: 1px; left: 1px; right: 1px; bottom: 1px;
            border-radius: inherit;
            background: repeating-linear-gradient(
                90deg,
                rgba(255,255,255,0.02) 0%,
                rgba(255,255,255,0) 10%,
                rgba(0,0,0,0.02) 20%,
                rgba(255,255,255,0) 30%
            );
            pointer-events: none;
        }

        .brushed-metal-btn:active {
            background: linear-gradient(to bottom, #2a2c30 0%, #3b3d42 100%);
            box-shadow: 
                0 1px 2px rgba(0,0,0,0.5),
                inset 0 4px 8px rgba(0,0,0,0.6);
            transform: translateY(1px);
        }

        .metal-inset {
            background: #1a1b1e;
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.6),
                inset -2px -2px 4px rgba(255,255,255,0.05);
            border: 1px solid #2a2c30;
        }

        .led-glow-primary {
            text-shadow: 0 0 8px #00ffcc, 0 0 16px #00ffcc;
            color: #00ffcc;
        }
        
        .led-indicator-on {
            background-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, inset 0 0 5px #fff;
        }

        .led-indicator-off {
            background-color: #ff3366;
            box-shadow: 0 0 5px rgba(255,51,102,0.5), inset 0 0 3px rgba(0,0,0,0.5);
        }

        .slider-track {
            background: #1a1b1e;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
    </style>
</head>
<body class="text-on-metal font-body-md min-h-screen flex">
<!-- Main Content -->
<main class="flex-1 overflow-y-auto p-margin-desktop">
<header class="flex justify-between items-center mb-8 h-20 px-margin-desktop py-unit metal-panel rounded-[16px] metal-cut-edge">
<div class="flex items-center gap-4">
<button class="brushed-metal-btn w-12 h-12 rounded-full flex items-center justify-center text-on-metal transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-wider uppercase text-on-metal text-shadow-sm">Living Room</h1>
</div>
<div class="flex items-center gap-4 text-on-metal-muted">
<span class="material-symbols-outlined cursor-pointer hover:text-primary-led transition-colors duration-200">qr_code_2</span>
<span class="material-symbols-outlined cursor-pointer hover:text-primary-led transition-colors duration-200">notifications</span>
</div>
</header>
<div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
<!-- Left Column: Lighting & Temp -->
<div class="md:col-span-8 flex flex-col gap-8">
<!-- Lighting Control -->
<section class="metal-panel rounded-[24px] p-8 flex flex-col items-center justify-center min-h-[300px] metal-cut-edge">
<h2 class="font-headline-md text-headline-md font-bold mb-6 w-full text-left tracking-widest text-on-metal-muted uppercase text-sm">Main Lighting</h2>
<div class="relative w-48 h-48 rounded-full metal-inset flex items-center justify-center">
<!-- Simulated circular slider -->
<div class="absolute w-36 h-36 rounded-full brushed-metal-btn flex items-center justify-center z-10 border-[4px] border-[#1a1b1e]">
<span class="font-headline-lg text-headline-lg font-bold led-glow-primary">75%</span>
</div>
<!-- Slider track representation -->
<div class="absolute w-44 h-44 rounded-full border-[8px] border-metal-dark border-t-primary-led border-r-primary-led rounded-bl-none transform rotate-45 opacity-80 shadow-[0_0_15px_rgba(0,255,204,0.3)]"></div>
<!-- Slider handle representation -->
<div class="absolute top-1 left-1/2 -translate-x-1/2 w-8 h-8 rounded-full brushed-metal-btn z-20 cursor-pointer flex items-center justify-center border-2 border-[#111]">
<div class="w-2 h-2 rounded-full led-indicator-on"></div>
</div>
</div>
<div class="mt-8 flex justify-between w-full max-w-xs text-on-metal-muted">
<span class="material-symbols-outlined">brightness_low</span>
<span class="material-symbols-outlined text-primary-led drop-shadow-[0_0_8px_rgba(0,255,204,0.5)]">brightness_high</span>
</div>
</section>
<!-- Climate Control -->
<section class="metal-panel rounded-[24px] p-8 flex flex-col min-h-[300px] metal-cut-edge">
<h2 class="font-headline-md text-headline-md font-bold mb-6 w-full text-left tracking-widest text-on-metal-muted uppercase text-sm">Air Conditioning</h2>
<div class="flex flex-1 items-center justify-center gap-12">
<button class="brushed-metal-btn w-16 h-16 rounded-full flex items-center justify-center text-on-metal text-2xl font-bold transition-all border-2 border-[#111]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">remove</span>
</button>
<div class="flex flex-col items-center bg-[#1a1b1e] px-8 py-4 rounded-xl border border-[#333] shadow-[inset_0_4px_8px_rgba(0,0,0,0.8)]">
<span class="font-headline-lg text-headline-lg text-[64px] leading-none font-bold led-glow-primary font-mono tracking-tighter">72°</span>
<span class="font-body-md text-body-md text-on-metal-muted mt-2 uppercase text-xs tracking-widest flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full led-indicator-on"></div> Cooling to 70°
</span>
</div>
<button class="brushed-metal-btn w-16 h-16 rounded-full flex items-center justify-center text-on-metal text-2xl font-bold transition-all border-2 border-[#111]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
<div class="mt-8 flex justify-center gap-4">
<div class="metal-inset px-6 py-2 rounded-sm border-l-2 border-primary-led flex items-center gap-2 cursor-pointer">
<span class="material-symbols-outlined text-primary-led text-sm">ac_unit</span>
<span class="font-label-caps text-label-caps text-primary-led tracking-widest">COOL</span>
</div>
<div class="brushed-metal-btn px-6 py-2 rounded-sm flex items-center gap-2 cursor-pointer text-on-metal-muted border border-[#111]">
<span class="material-symbols-outlined text-sm">air</span>
<span class="font-label-caps text-label-caps tracking-widest">FAN</span>
</div>
</div>
</section>
</div>
<!-- Right Column: Scenes & Devices -->
<div class="md:col-span-4 flex flex-col gap-8">
<!-- Scenes -->
<section class="metal-panel rounded-[24px] p-8 metal-cut-edge">
<h2 class="font-headline-md text-headline-md font-bold mb-6 tracking-widest text-on-metal-muted uppercase text-sm">Scenes</h2>
<div class="flex flex-col gap-4">
<button class="brushed-metal-btn w-full p-4 rounded-lg flex items-center gap-4 transition-all group border border-[#111]">
<div class="w-10 h-10 rounded-full metal-inset flex items-center justify-center text-on-metal-muted group-hover:text-primary-led transition-colors">
<span class="material-symbols-outlined">movie</span>
</div>
<span class="font-body-lg text-body-lg font-semibold text-on-metal group-hover:text-primary-led tracking-wide uppercase text-sm">Movie Night</span>
</button>
<button class="brushed-metal-btn w-full p-4 rounded-lg flex items-center gap-4 transition-all group border border-primary-led/30 shadow-[0_0_10px_rgba(0,255,204,0.1)]">
<div class="w-10 h-10 rounded-full bg-[#1a1b1e] border border-primary-led/50 flex items-center justify-center shadow-[inset_0_0_10px_rgba(0,255,204,0.2)]">
<span class="material-symbols-outlined led-glow-primary">menu_book</span>
</div>
<span class="font-body-lg text-body-lg font-semibold led-glow-primary tracking-wide uppercase text-sm">Reading</span>
<div class="ml-auto w-2 h-2 rounded-full led-indicator-on"></div>
</button>
<button class="brushed-metal-btn w-full p-4 rounded-lg flex items-center gap-4 transition-all group border border-[#111]">
<div class="w-10 h-10 rounded-full metal-inset flex items-center justify-center text-on-metal-muted group-hover:text-primary-led transition-colors">
<span class="material-symbols-outlined">self_improvement</span>
</div>
<span class="font-body-lg text-body-lg font-semibold text-on-metal group-hover:text-primary-led tracking-wide uppercase text-sm">Relax</span>
</button>
</div>
</section>
<!-- Devices -->
<section class="metal-panel rounded-[24px] p-8 flex-1 metal-cut-edge">
<h2 class="font-headline-md text-headline-md font-bold mb-6 tracking-widest text-on-metal-muted uppercase text-sm">Devices</h2>
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between p-3 bg-[#1a1b1e] rounded-lg border border-[#333] shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined led-glow-primary">tv</span>
<span class="font-body-md text-body-md font-semibold tracking-wide text-sm uppercase">Smart TV</span>
</div>
<!-- Toggle -->
<div class="w-14 h-6 rounded-sm metal-inset relative cursor-pointer flex items-center p-1 border-l-2 border-primary-led">
<div class="w-6 h-5 rounded-sm brushed-metal-btn absolute right-0.5 flex items-center justify-center">
<div class="w-1 h-3 bg-primary-led rounded-full opacity-50 shadow-[0_0_5px_#00ffcc]"></div>
</div>
</div>
</div>
<div class="flex items-center justify-between p-3 bg-[#1a1b1e] rounded-lg border border-[#333] shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] opacity-70">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-metal-muted">speaker</span>
<span class="font-body-md text-body-md font-semibold text-on-metal-muted tracking-wide text-sm uppercase">Sound System</span>
</div>
<!-- Toggle -->
<div class="w-14 h-6 rounded-sm metal-inset relative cursor-pointer flex items-center p-1 border-l-2 border-[#ff3366]/50">
<div class="w-6 h-5 rounded-sm brushed-metal-btn absolute left-0.5 flex items-center justify-center">
<div class="w-1 h-3 bg-[#ff3366] rounded-full opacity-30 shadow-[0_0_5px_#ff3366]"></div>
</div>
</div>
</div>
<div class="flex items-center justify-between p-3 bg-[#1a1b1e] rounded-lg border border-[#333] shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined led-glow-primary">blinds</span>
<span class="font-body-md text-body-md font-semibold tracking-wide text-sm uppercase">Smart Blinds</span>
</div>
<!-- Toggle -->
<div class="w-14 h-6 rounded-sm metal-inset relative cursor-pointer flex items-center p-1 border-l-2 border-primary-led">
<div class="w-6 h-5 rounded-sm brushed-metal-btn absolute right-0.5 flex items-center justify-center">
<div class="w-1 h-3 bg-primary-led rounded-full opacity-50 shadow-[0_0_5px_#00ffcc]"></div>
</div>
</div>
</div>
</div>
</section>
</div>
</div>
</main>
</body></html>
