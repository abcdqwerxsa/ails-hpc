GresTypes=gpu
ClusterName=ails-hpc-cluster
ControlMachine=slurmctld
ControlAddr=slurmctld

SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SwitchType=switch/none
MpiDefault=none
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
ProctrackType=proctrack/pgid
ReturnToService=2
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0
SchedulerType=sched/backfill
SelectType=select/cons_tres
# CR_Core_Memory：内存作为可消耗 TRES 参与调度与记账（纯 CR_Core 下 AllocMem 恒 0，
# 即使作业显式 --mem 也不入账——监控/计费的内存维度失真）。
SelectTypeParameters=CR_Core_Memory
# 默认每核内存记账（MB）：作业不显式申请内存时按核数计账。node2/3（8核）2800≤3000；
# node1（16 线程）5600≤RealMemory 6000，不超卖。
DefMemPerCPU=350

# Accounting Storage
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageUser=slurm
# 强制 association：每个提交的作业必须携带已存在的 account+user 关联（L3 真实记账）。
# entrypoint 在 slurmctld 启动时按 users.yaml 建 account/association。无关联的提交会被拒（fail-safe）。
AccountingStorageEnforce=associations
JobCompType=jobcomp/none

# Logging
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# Compute Nodes —— 大小核切分（宿主 i9-13900：P=cpu0-15（8核×2线程），E=cpu16-31（16核）；
# 容器 cpuset 绑核见 docker-compose.yml，分区按核型划分）：
#   node1  = P 核（全部 16 线程）+ GPU → performance 分区
#   node2/3 = E 核（各 8 核）→ standard 分区（默认）
NodeName=node1 RealMemory=6000 Sockets=1 CoresPerSocket=8 ThreadsPerCore=2 State=UNKNOWN Gres=gpu:1
NodeName=node[2-3] RealMemory=3000 Sockets=1 CoresPerSocket=8 ThreadsPerCore=1 State=UNKNOWN
PartitionName=standard Nodes=node[2-3] Default=YES MaxTime=INFINITE State=UP
PartitionName=performance Nodes=node1 Default=NO MaxTime=INFINITE State=UP
PrivateData=none
