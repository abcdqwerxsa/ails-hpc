name: ails-slurm-dev

services:
  slurm-db:
    image: docker.m.daocloud.io/library/mariadb:10.11
    container_name: slurm-db
    hostname: slurm-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: slurmdbpass
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - slurm-net
    restart: unless-stopped

  slurmdbd:
    build:
      context: .
      dockerfile: Dockerfile
    image: ails-slurm-node:latest
    container_name: slurmdbd
    hostname: slurmdbd
    environment:
      ROLE: slurmdbd
    volumes:
      - ./config/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./config/slurmdbd.conf:/etc/slurm/slurmdbd.conf.template:ro
      - shared-storage:/shared
    depends_on:
      - slurm-db
    networks:
      - slurm-net
    restart: unless-stopped

  slurmctld:
    build:
      context: .
      dockerfile: Dockerfile
    image: ails-slurm-node:latest
    container_name: slurmctld
    hostname: slurmctld
    environment:
      ROLE: slurmctld
    ports:
      - "6817:6817"
      - "6820:6820"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    extra_hosts:
      - "slurmctld:127.0.0.1"
    volumes:
      - ./config/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./config/slurmdbd.conf:/etc/slurm/slurmdbd.conf.template:ro
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/users.yaml:/etc/slurm/ails-users.yaml:ro
      - ./config/slurm-seeds.json:/etc/slurm/ails-seeds.json:ro
      - slurmctld-state:/var/spool/slurmctld
      - shared-storage:/shared
    depends_on:
      - slurmdbd
    networks:
      - slurm-net
    restart: unless-stopped

  node1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ails-slurm-node:latest
    container_name: node1
    hostname: node1
    environment:
      ROLE: slurmd
    # 大小核切分：node1 绑全部 P 核线程（i9-13900 P=cpu0-15）→ slurm performance 分区
    cpuset: "0-15"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - ./config/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/gres.conf:/etc/slurm/gres.conf:ro
      - ./config/users.yaml:/etc/slurm/ails-users.yaml:ro
      - ./config/slurm-seeds.json:/etc/slurm/ails-seeds.json:ro
      - shared-storage:/shared
    depends_on:
      - slurmctld
    networks:
      - slurm-net
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ails-slurm-node:latest
    container_name: node2
    hostname: node2
    environment:
      ROLE: slurmd
    # 大小核切分：node2 绑 E 核 cpu16-23 → slurm standard 分区
    cpuset: "16-23"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./config/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/users.yaml:/etc/slurm/ails-users.yaml:ro
      - ./config/slurm-seeds.json:/etc/slurm/ails-seeds.json:ro
      - shared-storage:/shared
    depends_on:
      - slurmctld
    networks:
      - slurm-net
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    image: ails-slurm-node:latest
    container_name: node3
    hostname: node3
    environment:
      ROLE: slurmd
    # 大小核切分：node3 绑 E 核 cpu24-31 → slurm standard 分区
    cpuset: "24-31"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./config/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/users.yaml:/etc/slurm/ails-users.yaml:ro
      - ./config/slurm-seeds.json:/etc/slurm/ails-seeds.json:ro
      - shared-storage:/shared
    depends_on:
      - slurmctld
    networks:
      - slurm-net
    restart: unless-stopped

networks:
  slurm-net:
    driver: bridge

volumes:
  mariadb-data:
  slurmctld-state:
  shared-storage:
